[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.14.14"
hooks = [
  { id = "ruff-check", args = ["--fix"], types_or = ["python", "pyi"] },
  { id = "ruff-format", types_or = ["python", "pyi"] },
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-added-large-files" },
  { id = "check-json" },
]

[[repos]]
repo = "https://github.com/thlorenz/doctoc"
rev = "v2.2.0"
hooks = [
  { id = "doctoc", files = "^README\\.md$", args = ["--maxlevel", "3"], exclude = "(skills/|/commands/.*\\.md)$" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "check-cli-forms", name = "Astro CLI v1/v2 command format", entry = "python3 scripts/check_cli_forms.py", language = "system", pass_filenames = false, files = "^(skills/.*\\.md|shared/astro-cli-version\\.md|scripts/.*\\.py)$" },
  { id = "test-cli-forms", name = "check_cli_forms tests", entry = "python3 -m unittest discover -s scripts/tests", language = "system", pass_filenames = false, files = "^(skills/.*\\.md|shared/|scripts/)" },
]
